name: Typing coverage comment

on:
  workflow_run:
    workflows: ["Typing coverage"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  comment:
    name: Post typing coverage report
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled'
    steps:
      - name: Download typing coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: typing-coverage-report
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          path: report

      - name: Create or update sticky PR comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require("fs");
            const path = require("path");

            const prNumberPath = path.join("report", "pr-number.txt");
            const commentPath = path.join("report", "comment.md");
            if (!fs.existsSync(prNumberPath) || !fs.existsSync(commentPath)) {
              core.info("Typing coverage report artifact missing; skipping PR comment.");
              return;
            }

            const issueNumber = Number.parseInt(
              fs.readFileSync(prNumberPath, "utf8").trim(),
              10
            );
            if (!Number.isInteger(issueNumber) || issueNumber <= 0) {
              core.setFailed(`Invalid PR number in artifact: ${issueNumber}`);
              return;
            }

            const body = fs.readFileSync(commentPath, "utf8").trim();
            const marker = "<!-- rope-typing-coverage -->";
            if (!body.startsWith(marker)) {
              core.setFailed("Report artifact is missing expected comment marker.");
              return;
            }

            const { owner, repo } = context.repo;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number: issueNumber, per_page: 100 }
            );
            const existing = comments.find(
              (c) =>
                c.user &&
                c.user.type === "Bot" &&
                typeof c.body === "string" &&
                c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Updated typing coverage comment #${existing.id} on PR #${issueNumber}.`);
            } else {
              const created = await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body,
              });
              core.info(`Created typing coverage comment #${created.data.id} on PR #${issueNumber}.`);
            }
